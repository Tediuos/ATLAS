name: Tests and offline evaluation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check atlas ui tests scripts
      - run: ruff format --check atlas ui tests scripts
      - run: pytest --cov=atlas --cov-report=term --cov-report=json:coverage.json --cov-fail-under=80 --junitxml=test-results.xml
      - run: python -m atlas.evaluation.runner --repetitions 5 --output evaluation/ci-results
      - run: python -m atlas.evaluation.baseline --output evaluation/ci-results
      - run: python -m atlas.evaluation.judge_run --output evaluation/ci-results
      - run: python scripts/summarize_validation.py --output evaluation/ci-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-python-${{ matrix.python }}
          path: |
            coverage.json
            test-results.xml
            evaluation/ci-results/
